name: Secret scan
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '25 1 * * 1'
permissions:
  contents: read
jobs:
  history:
    name: Git history and secret detection canary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned scanner
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan without exposing findings in public logs
        shell: bash
        run: |
          if "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts=--all . > "$RUNNER_TEMP/secret-scan.log" 2>&1; then
            echo "Git history secret scan passed."
          else
            echo "Secret scanning needs attention; inspect source changes privately. Scan errors do not pass."
            exit 1
          fi
      - name: Verify narrow exceptions do not suppress new secrets
        run: python3 backend/infra/security/verify_secret_detection.py "$RUNNER_TEMP/gitleaks"
