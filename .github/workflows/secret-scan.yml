name: Secret scan
on:
  workflow_call:
    inputs:
      full-history:
        type: boolean
        default: true
      base-sha:
        type: string
        default: ""
      head-sha:
        type: string
        default: ""
  workflow_dispatch:
  schedule:
    - cron: '25 1 * * 1'
permissions:
  contents: read
jobs:
  history:
    name: Git history and secret detection canary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned scanner
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan without exposing findings in public logs
        env:
          SCAN_FULL: ${{ inputs.full-history }}
          SCAN_BASE: ${{ inputs.base-sha }}
          SCAN_HEAD: ${{ inputs.head-sha }}
          SCAN_EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          full = os.environ['SCAN_FULL'] == 'true' or os.environ['SCAN_EVENT'] != 'pull_request'
          base, head = os.environ['SCAN_BASE'], os.environ['SCAN_HEAD']
          if not full:
              if not all(re.fullmatch('[0-9a-f]{40}', value) for value in (base, head)):
                  raise SystemExit('Missing validated secret scan range')
              subprocess.run(['git', 'merge-base', '--is-ancestor', base, head], check=True)
          temp = Path(os.environ['RUNNER_TEMP'])
          command = [str(temp / 'gitleaks'), 'git', '--redact=100', '--no-banner',
                     '--log-opts=' + ('--all' if full else base + '..' + head), '.']
          with (temp / 'secret-scan.log').open('wb') as output:
              result = subprocess.run(command, stdout=output, stderr=subprocess.STDOUT)
          if result.returncode:
              raise SystemExit('Secret scanning needs attention; inspect changes privately. Scan errors do not pass.')
          print('Secret scan passed (' + ('full history' if full else 'PR commits') + ').')
          PY
      - name: Verify narrow exceptions do not suppress new secrets
        run: python3 backend/infra/security/verify_secret_detection.py "$RUNNER_TEMP/gitleaks"
