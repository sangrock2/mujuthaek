name: CI
on:
  workflow_call:
    inputs:
      selection:
        type: string
        default: ""
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      selection: ${{ steps.select.outputs.selection }}
      java_any: ${{ steps.select.outputs.java_any }}
      java_matrix: ${{ steps.select.outputs.java_matrix }}
      collector: ${{ steps.select.outputs.collector }}
      extraction: ${{ steps.select.outputs.extraction }}
      platform: ${{ steps.select.outputs.platform }}
      infra: ${{ steps.select.outputs.infra }}
      gateway: ${{ steps.select.outputs.gateway }}
      broker: ${{ steps.select.outputs.broker }}
      dependencies: ${{ steps.select.outputs.dependencies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: select
        env:
          SELECTION: ${{ inputs.selection }}
        run: |
          if [ -n "$SELECTION" ]; then
            python3 backend/infra/ci/plan.py --selection "$SELECTION"
          else
            python3 backend/infra/ci/plan.py --all
          fi
  gateway:
    needs: plan
    if: needs.plan.outputs.gateway == 'true'
    name: nginx adversarial checks (loopback only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the production gateway against an isolated upstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backend/infra/security/build
          python3 backend/infra/security/test_gateway.py > backend/infra/security/build/gateway.json
          python3 -c 'import json; r=json.load(open("backend/infra/security/build/gateway.json")); assert r["ok"] and len(r["checks"]) == 18 and all(r["checks"].values()), "Missing or failed gateway evidence"; print(json.dumps(r, indent=2))'
      - name: Verify gateway TLS integration
        run: python3 backend/infra/deploy/tests/verify_https.py
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Certificate automation offline tests
        working-directory: backend/services/collector
        run: uv run --frozen pytest -q ../../infra/deploy/tests/test_certificates.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gateway-security-evidence
          path: backend/infra/security/build/gateway.json
          retention-days: 30
  java:
    needs: plan
    if: needs.plan.outputs.java_any == 'true'
    name: ${{ matrix.service }} (check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.java_matrix) }}
    defaults:
      run:
        working-directory: backend/services/${{ matrix.service }}
    env:
      NOTIFICATION_MAIL_PROVIDER: log
      NOTIFICATION_PUSH_PROVIDER: log
    steps:
      # API는 contracts와 extraction의 법정동코드 원본도 빌드에 사용해요.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          problem-matcher: true
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      # Testcontainers가 PostGIS·RabbitMQ를 직접 띄워요. Docker 없이는 건너뛰지 않아요.
      - name: Docker 확인
        run: docker info
      # gradlew의 저장소 실행 비트에 의존하지 않아요.
      - name: 포맷·테스트·커버리지 검사
        run: bash ./gradlew --no-daemon --stacktrace check securityDependencyInventory --init-script ../../infra/security/dependencies.init.gradle
      - name: Audit resolved runtime dependencies
        run: python3 ../../infra/security/audit_dependencies.py build/reports/security/dependencies.json --output build/reports/security/audit.json
      - name: 검사 보고서 보관
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-${{ matrix.service }}-reports
          path: |
            backend/services/${{ matrix.service }}/build/reports/
            backend/services/${{ matrix.service }}/build/test-results/
          if-no-files-found: warn
          retention-days: 7

  collector:
    needs: plan
    if: needs.plan.outputs.collector == 'true'
    uses: ./.github/workflows/collector-native.yml
  platform:
    needs: plan
    if: needs.plan.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv run --frozen ruff check . && uv run --frozen ruff format --check .
        working-directory: backend/libs/python-platform
      - run: uv run --frozen pytest -q
        working-directory: backend/libs/python-platform
  extraction:
    needs: plan
    if: needs.plan.outputs.extraction == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv run --frozen ruff check . && uv run --frozen ruff format --check .
        working-directory: backend/services/extraction
      - run: uv run --frozen pytest -q
        working-directory: backend/services/extraction
  broker:
    needs: plan
    if: needs.plan.outputs.broker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv run --frozen python ../../infra/security/test_service_isolation.py
        working-directory: backend/services/extraction
  infra:
    needs: plan
    if: needs.plan.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s backend/infra/deploy/personal/tests -v
      - run: python3 -m unittest discover -s backend/infra/security/tests -v
  ready:
    name: Backend ready
    needs: [plan, java, collector, platform, extraction, broker, infra, gateway]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          CI_SELECTION: ${{ needs.plan.outputs.selection }}
          CI_RESULTS: ${{ toJSON(needs) }}
          CI_GATE: backend
        run: python3 backend/infra/ci/gate.py
