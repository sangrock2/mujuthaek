name: Resolved dependency graph
on:
  push:
    branches: [main]
    paths:
      - backend/services/api/**
      - backend/services/notification/**
      - backend/infra/security/dependencies.init.gradle
      - backend/infra/security/submit_dependencies.py
      - .github/workflows/dependency-submission.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resolved-dependency-graph
  cancel-in-progress: false
jobs:
  resolve:
    if: github.repository == 'sangrock2/mujuthaek' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        service: [api, notification]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Resolve with existing strict dependency verification
        working-directory: backend/services/${{ matrix.service }}
        run: bash ./gradlew --no-daemon securityDependencyInventory --init-script ../../infra/security/dependencies.init.gradle
      - name: Name inventory
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          mkdir inventories
          cp "backend/services/$SERVICE/build/reports/security/dependencies.json" "inventories/$SERVICE.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maven-inventory-${{ matrix.service }}
          path: inventories/*.json
          retention-days: 7
          if-no-files-found: error
  submit:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: maven-inventory-*
          path: inventories
          merge-multiple: true
      - name: Publish data without running builds or downloaded code
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 backend/infra/security/submit_dependencies.py
