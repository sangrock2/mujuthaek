name: Security regression proof
on:
  pull_request:
    branches: [dev, main]
    paths:
      - backend/services/api/src/main/java/kr/mujuthaek/api/user/**
      - backend/services/api/src/test/java/kr/mujuthaek/api/user/security/SecurityIntegrationTest.java
      - backend/infra/security/**
      - .github/workflows/security-proof.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  logout:
    name: Historical logout reproduction and patched verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOTIFICATION_MAIL_PROVIDER: log
      NOTIFICATION_PUSH_PROVIDER: log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          problem-matcher: true
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Reproduce only in isolated Testcontainers databases
        run: python3 backend/infra/security/verify_logout_regression.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: logout-security-proof
          path: backend/services/api/build/reports/security/
          retention-days: 30
