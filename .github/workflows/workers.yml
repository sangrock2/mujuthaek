name: Worker images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: worker-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COLLECTOR_TEST_DB_URL: postgresql://postgres:worker-test-only@127.0.0.1:5432/collector_test
      EXTRACTION_TEST_DB_URL: postgresql://postgres:worker-test-only@127.0.0.1:5432/extraction_test
    steps:
      - name: Require personal main branch
        env:
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: test "$REF" = refs/heads/main && test "$REPOSITORY" = sangrock2/mujuthaek
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # No shared cache in a job that can mint the deploy role: caches written by default-branch (dev) runs are
      # readable from main, so a poisoned entry would run here with the OIDC token (security audit section 4).
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.1"
          enable-cache: false
      - run: uv sync --frozen
        working-directory: backend/services/collector
      - run: uv sync --frozen
        working-directory: backend/services/extraction
      - name: Prepare isolated worker test databases
        run: |
          backend/services/collector/.venv/bin/python - <<'PY'
          from pathlib import Path
          import psycopg
          with psycopg.connect('postgresql://postgres:worker-test-only@127.0.0.1:5432/postgres', autocommit=True) as conn:
              conn.execute('create database collector_test')
              conn.execute('create database extraction_test')
          with psycopg.connect('postgresql://postgres:worker-test-only@127.0.0.1:5432/collector_test', autocommit=True) as conn:
              for path in sorted(Path('backend/services/collector/migrations').glob('V*.sql')):
                  conn.execute(path.read_text())
          PY
      - name: Collector database and offline regression tests
        run: uv run --frozen pytest -q
        working-directory: backend/services/collector
      - name: Extraction publication and database regression tests
        run: uv run --frozen pytest -q
        working-directory: backend/services/extraction
      - name: Build pinned worker images
        env:
          SHA: ${{ github.sha }}
        run: |
          docker build -f backend/services/collector/Dockerfile -t "mujuthaek-personal-collector:$SHA" backend
          docker build -f backend/services/extraction/Dockerfile -t "mujuthaek-personal-extraction:$SHA" backend
          docker save "mujuthaek-personal-collector:$SHA" "mujuthaek-personal-extraction:$SHA" | gzip > worker-images.tar.gz
          sha256sum worker-images.tar.gz > worker-images.sha256
          printf '%s\n' "$SHA" > worker-commit.txt
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          allowed-account-ids: "659355919826"
      # Release objects are create-only (security audit L-17): the deploy role may write deployments/releases/* only with
      # If-None-Match, so nothing can replace an archive a later rollback would trust. A re-run for a commit whose pair
      # is already stored keeps the stored pair (the checksum is written last and the host verifies the archive
      # against it). A single PUT (no multipart, up to 5 GiB) is required because multipart cannot carry the condition.
      - name: Store private worker image archive
        env:
          SHA: ${{ github.sha }}
        run: |
          if aws s3api head-object --bucket mujuthaek-personal-659355919826-raw \
              --key "deployments/releases/workers/$SHA/worker-images.sha256" > /dev/null 2>&1; then
            echo "Worker images for $SHA are already stored; keeping the stored pair"
            exit 0
          fi
          for name in worker-images.tar.gz worker-images.sha256; do
            aws s3api put-object --bucket mujuthaek-personal-659355919826-raw \
              --key "deployments/releases/workers/$SHA/$name" --body "$name" \
              --server-side-encryption AES256 --if-none-match '*' > /dev/null
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-image-record-${{ github.sha }}
          path: |
            worker-images.sha256
            worker-commit.txt
          retention-days: 7
