name: Web

# 프론트(frontend/): format · lint · 입력 회귀 · typecheck · build
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web (format · lint · typecheck · build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-security-baseline.mjs
      - run: node --test scripts/audit-dependencies.test.mjs
      - run: node scripts/audit-dependencies.mjs
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test:tooling
      - run: pnpm test:ui
      - run: pnpm typecheck
      - run: pnpm build
