name: Contracts

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice-contracts:
    name: notice contracts (schema · semantic regression)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/contracts/requirements-dev.txt
      - run: python -m pip install -r contracts/requirements-dev.txt
      - run: python contracts/tools/validate_contracts.py
      - run: python -m unittest discover -s contracts/tests -p 'test_*.py' -v
