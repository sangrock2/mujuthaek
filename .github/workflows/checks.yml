name: Checks
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    uses: ./.github/workflows/web.yml
  backend:
    uses: ./.github/workflows/ci.yml
  contracts:
    uses: ./.github/workflows/contracts.yml
  e2e:
    uses: ./.github/workflows/e2e.yml
  ready:
    name: CI ready
    if: always()
    needs: [web, backend, contracts, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check
        env:
          WEB: ${{ needs.web.result }}
          BACKEND: ${{ needs.backend.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          test "$WEB" = success
          test "$BACKEND" = success
          test "$CONTRACTS" = success
          test "$E2E" = success
