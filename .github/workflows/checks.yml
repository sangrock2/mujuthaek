name: Checks
on:
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
  web:
    uses: ./.github/workflows/web.yml
  backend:
    uses: ./.github/workflows/ci.yml
  contracts:
    uses: ./.github/workflows/contracts.yml
  e2e:
    uses: ./.github/workflows/e2e.yml
  secrets:
    uses: ./.github/workflows/secret-scan.yml
  ready:
    name: CI ready
    if: always()
    needs: [dependencies, web, backend, contracts, e2e, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check
        env:
          WEB: ${{ needs.web.result }}
          BACKEND: ${{ needs.backend.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          E2E: ${{ needs.e2e.result }}
          SECRETS: ${{ needs.secrets.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
          EVENT: ${{ github.event_name }}
        run: |
          test "$WEB" = success
          test "$BACKEND" = success
          test "$CONTRACTS" = success
          test "$E2E" = success
          test "$SECRETS" = success
          if [ "$EVENT" = pull_request ]; then test "$DEPENDENCIES" = success; fi
