# Vercel rewrites → nginx → 이 서버. X-Forwarded-Proto·Host로 https 주소(쿠키·OAuth 리다이렉트)를 만들어요
server:
  forward-headers-strategy: framework

# 운영은 health와 prometheus만 열어요. 포트는 127.0.0.1에만 묶여 있지만 같은 컨테이너 망의 다른 컨테이너는
# notification:8081에 바로 닿아서, prometheus는 METRICS_TOKEN(Bearer)이 있을 때만 열려요. 토큰을 넣지 않으면
# prometheus는 404예요(2026-11-16 보안 감사 4장). health는 그대로 인증 없이 열려요
notification:
  metrics:
    require-token: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ecs                      # JSON 한 줄 로그
