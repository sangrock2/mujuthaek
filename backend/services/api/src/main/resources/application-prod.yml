# Vercel rewrites → nginx → 이 서버. X-Forwarded-Proto·Host로 https 주소(쿠키·OAuth 리다이렉트)를 만들어요
server:
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 64
      min-spare: 4
    max-connections: 256
    accept-count: 32
    connection-timeout: 10s
  max-http-request-header-size: 16KB
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax

# 운영은 health와 prometheus만 열어요. nginx가 /actuator/health 말고는 막고 포트도 127.0.0.1에만 묶여 있어요.
# 다만 같은 컨테이너 망의 다른 컨테이너는 api:8080에 바로 닿아서, prometheus는 METRICS_TOKEN(Bearer)이 있을 때만 열려요.
# 토큰을 넣지 않으면 prometheus는 404예요(2026-11-16 보안 감사 4장). health는 그대로 인증 없이 열려요
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ecs                      # JSON 한 줄 로그

app:
  jwt:
    secret: ${JWT_SECRET}                # 운영은 기본값 없이 꼭 넣어요
    cookie-secure: true                  # refresh token 쿠키는 HTTPS에서만
  metrics:
    require-token: true                  # METRICS_TOKEN이 없으면 /actuator/prometheus를 막아요
