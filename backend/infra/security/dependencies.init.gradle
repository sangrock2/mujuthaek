import groovy.json.JsonOutput

allprojects {
    tasks.register('securityDependencyInventory') {
        description = 'Export the actually resolved runtime artifacts for vulnerability checks.'
        doLast {
            def modules = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
                .collect { it.moduleVersion.id }
                .collect { [package: [ecosystem: 'Maven', name: "${it.group}:${it.name}".toString()], version: it.version] }
                .unique()
                .sort { a, b -> a.package.name <=> b.package.name }
            def output = layout.buildDirectory.file('reports/security/dependencies.json').get().asFile
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson(modules))
            println "Runtime dependency inventory written (${modules.size()} modules)."
        }
    }
}
