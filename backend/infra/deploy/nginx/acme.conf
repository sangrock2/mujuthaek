# Port 80 serves ACME validation files only. Application/API requests never reach upstream here.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
        limit_except GET HEAD { deny all; }
    }
    location / { return 404; }
}
