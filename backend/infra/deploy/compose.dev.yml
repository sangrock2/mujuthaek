# 개발 서버(dev EC2) 구성. compose.prod.yml과 같고 수집기가 없어요.
# 수집 이벤트(raw.notice.collected·raw.policy.collected·area.source.ready)는 운영 RabbitMQ의 dev.mirror 큐에서
# shovel(from-prod)로 받아 와요 (shovel.sh). 실행: docker compose -f compose.dev.yml --env-file .env --env-file versions.env ...
name: mujuthaek

# 로그는 서버 디스크에만 있어요(밖으로 보내지 않음). 컨테이너마다 50MB × 6개(300MB)까지 돌려써요: 장애 원인을 며칠 거슬러 볼 수 있게.
# 큰 오류는 슬랙으로도 알려요(SLACK_WEBHOOK_URL, README 「운영 알림·로그」)
x-logging: &logging
  driver: json-file
  options: { max-size: "50m", max-file: "6" }

x-app: &app
  # --env-file is for interpolation; each service below receives only its explicit allowlist.
  restart: unless-stopped
  logging: *logging
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  pids_limit: 512
  depends_on:
    rabbitmq: { condition: service_healthy }

services:
  rabbitmq:
    image: rabbitmq:4.1-management@sha256:479361ae8fbb8c852bf67f4acbbfa6f3f6810f8f08119ae6ad4d922bfeaa27c3
    # 노드 이름(rabbit@<호스트 이름>)이 데이터 폴더 이름이에요. 고정하지 않으면 컨테이너가 다시 만들어질 때(설정이 바뀐 배포)
    # 호스트 이름이 바뀌어 빈 폴더로 시작해 큐 안의 메시지·shovel 설정이 사라져요 (실측 2026-10-29 운영: 도로명주소 적재 요청 12건)
    hostname: rabbitmq
    mem_limit: 200m
    restart: unless-stopped
    logging: *logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      # 컨테이너 상한(200MB)보다 낮게: 180MB를 넘으면 발행을 잠시 막아요
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit vm_memory_high_watermark {absolute,188743680}"
    ports:
      - "127.0.0.1:15672:15672" # 관리 화면은 서버 안에서만
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro # 관리 화면 + shovel
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate-extraction:
    image: flyway/flyway:11.14@sha256:510ae446ffc9129c061860e73633dbc1898d638dc8c965e3b57bba3e916bc32d
    profiles: [migrate]
    logging: *logging
    # 암호는 명령행 인자(프로세스 목록·docker inspect의 Args에 보임)가 아니라 환경 변수로 넘겨요
    environment:
      FLYWAY_PASSWORD: ${EXTRACTION_DB_PASSWORD}
    command: >
      -url=jdbc:postgresql://${RDS_HOST}:5432/extraction_dev -user=${EXTRACTION_DB_USER:-extraction_app}
      -locations=filesystem:/flyway/sql -connectRetries=10 migrate
    volumes:
      - ./migrations/extraction:/flyway/sql:ro

  api:
    <<: *app
    image: ${IMAGE_PREFIX:-ghcr.io/prgrms-be-devcourse/nbe11-13-final-team02}/api:${API_TAG:?versions.env에 API_TAG가 없어요}
    mem_limit: 600m
    environment:
      API_QUERY_TIMEOUT:
      ADMIN_BOOTSTRAP_USER_ID:
      API_DB_PASSWORD:
      API_DB_URL:
      API_DB_USER:
      AWS_ACCESS_KEY_ID:
      AWS_EC2_METADATA_DISABLED:
      AWS_REGION:
      AWS_SECRET_ACCESS_KEY:
      AWS_SESSION_TOKEN:
      COLLECTOR_ADMIN_TOKEN:
      COLLECTOR_ADMIN_URL:
      CORS_ORIGINS:
      EMAIL_UNSUBSCRIBE_KEY:
      EXTRACTION_REVIEW_TOKEN:
      EXTRACTION_SLACK_WEBHOOK_URL:
      FRONTEND_URL:
      GA_CREDENTIALS_FILE:
      GA_PROPERTY_ID:
      GOOGLE_CLIENT_ID:
      GOOGLE_CLIENT_SECRET:
      JAVA_TOOL_OPTIONS:
      JUDGING_BENEFIT_CACHE_SIZE:
      JUDGING_CACHE_SIZE:
      JUDGING_PREWARM:
      JUSO_COORD_API_KEY:
      JUSO_SEARCH_API_KEY:
      JWT_SECRET:
      KAKAO_CLIENT_ID:
      KAKAO_CLIENT_SECRET:
      METRICS_TOKEN:
      MINIO_ROOT_PASSWORD:
      MINIO_ROOT_USER:
      NAVER_CLIENT_ID:
      NAVER_CLIENT_SECRET:
      NOTIFICATION_INTERNAL_TOKEN:
      OAUTH_REDIRECT_BASE_URL:
      PUSH_VAPID_PUBLIC_KEY:
      RABBITMQ_HOST:
      RABBITMQ_PASSWORD:
      RABBITMQ_USER:
      S3_BUCKET:
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      SLACK_WEBHOOK_URL:
      SPRING_PROFILES_ACTIVE: prod
      TRAFFIC_INGEST_TOKEN:
      TRAFFIC_IP_SALT:
      MUJUTHAEK_ENV: dev # 슬랙 알림 머리 [dev api]
      NOTIFICATION_SERVER_URL: http://notification:8081
      # 같은 compose 안의 서비스 주소. 없으면 api 컨테이너 안의 localhost로 불러 연결이 거부돼요(관리자 검수·수집 현황 503)
      EXTRACTION_REVIEW_URL: http://extraction:8092
      # 개발 서버에는 수집기가 없어서 수집 현황 화면은 503이 정상이에요
      OPS_ALERT_IGNORE_CODES: NOTICE_COLLECTOR_UNAVAILABLE # 그 503은 슬랙으로 알리지 않아요
      API_DOCS_ENABLED: "true" # API 문서(스웨거) /swagger-ui.html. 운영은 꺼져 있어요
    ports: ["127.0.0.1:8080:8080"]

  notification:
    <<: *app
    image: ${IMAGE_PREFIX:-ghcr.io/prgrms-be-devcourse/nbe11-13-final-team02}/notification:${NOTIFICATION_TAG:?versions.env에 NOTIFICATION_TAG가 없어요}
    environment:
      AWS_ACCESS_KEY_ID:
      AWS_EC2_METADATA_DISABLED:
      AWS_REGION:
      AWS_SECRET_ACCESS_KEY:
      AWS_SESSION_TOKEN:
      JAVA_TOOL_OPTIONS:
      METRICS_TOKEN:
      MUJUTHAEK_ENV:
      NOTIFICATION_DB_PASSWORD:
      NOTIFICATION_DB_URL:
      NOTIFICATION_DB_USER:
      NOTIFICATION_INTERNAL_TOKEN:
      NOTIFICATION_MAIL_CONSENT_API_URL:
      NOTIFICATION_MAIL_FEEDBACK_ADDRESS:
      NOTIFICATION_MAIL_FROM:
      NOTIFICATION_MAIL_PROVIDER:
      NOTIFICATION_PUSH_PROVIDER:
      NOTIFICATION_SES_CONFIGURATION_SET:
      NOTIFICATION_SES_MAX_PER_SECOND:
      NOTIFICATION_WEB_BASE_URL:
      PUSH_VAPID_PRIVATE_KEY:
      PUSH_VAPID_PUBLIC_KEY:
      PUSH_VAPID_SUBJECT:
      RABBITMQ_HOST:
      RABBITMQ_PASSWORD:
      RABBITMQ_USER:
      SLACK_WEBHOOK_URL:
      SPRING_PROFILES_ACTIVE: prod
    mem_limit: 300m
    ports: ["127.0.0.1:8081:8081"]

  extraction:
    <<: *app
    image: ${IMAGE_PREFIX:-ghcr.io/prgrms-be-devcourse/nbe11-13-final-team02}/extraction:${EXTRACTION_TAG:?versions.env에 EXTRACTION_TAG가 없어요}
    mem_limit: 450m
    environment:
      AWS_ACCESS_KEY_ID:
      AWS_EC2_METADATA_DISABLED:
      AWS_REGION:
      AWS_SECRET_ACCESS_KEY:
      AWS_SESSION_TOKEN:
      CONTRACTS_DIR:
      EXTRACTION_BENEFIT_ENABLED:
      EXTRACTION_CALL_CACHE:
      EXTRACTION_CALL_CACHE_DAYS:
      EXTRACTION_DAILY_BUDGET_USD:
      EXTRACTION_ENV:
      EXTRACTION_IMAGE_OCR:
      EXTRACTION_LOCAL_FILES_DIR:
      EXTRACTION_MAX_ATTEMPTS:
      EXTRACTION_METHOD:
      EXTRACTION_MODEL_MODE:
      EXTRACTION_MONTHLY_BUDGET_USD:
      EXTRACTION_NOTICE_BUDGET_USD:
      EXTRACTION_PARALLEL_CALLS:
      EXTRACTION_PARALLEL_STAGGER_SECONDS:
      EXTRACTION_PRESPLIT_DOC_ROWS:
      EXTRACTION_RECORDED_DIR:
      EXTRACTION_RELAY_SECONDS:
      EXTRACTION_REPAIR_MIN_BAD_ITEMS:
      EXTRACTION_REQUIRE_PDF:
      EXTRACTION_RETRY_SECONDS:
      EXTRACTION_REVIEW_DB_POOL:
      EXTRACTION_REVIEW_HOST:
      EXTRACTION_REVIEW_PORT:
      EXTRACTION_REVIEW_TOKEN:
      EXTRACTION_SERIAL_EVENTS:
      EXTRACTION_STANDIN_DIR:
      EXTRACTION_STANDIN_REPLAY_DIR:
      LANGSMITH_API_KEY:
      LANGSMITH_ENDPOINT:
      LANGSMITH_PROJECT:
      LANGSMITH_TRACING:
      LOCAL_AI_MODEL:
      LOCAL_AI_URL:
      OPENAI_API_KEY:
      OPENAI_LIGHT_CALLS:
      OPENAI_LIGHT_EFFORT:
      OPENAI_MODEL:
      OPENAI_REASONING_EFFORT:
      OPENAI_SHARED_SCHEMA:
      OPENAI_STREAM:
      S3_BUCKET:
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      SLACK_WEBHOOK_URL:
      SERVICE_NAME: extraction
      MUJUTHAEK_ENV: dev
      DB_URL: ${EXTRACTION_DB_URL}
      # 공개 관문은 실패 시 닫힘(manual: 결과를 DB에 보류)이에요. 코드 기본값과 같지만, 이미지 버전과 무관하게 명시해요.
      # 예전 동작이 필요하면 .env에 EXTRACTION_PUBLICATION_MODE=legacy를 명시하세요(보안 감사 4절)
      EXTRACTION_PUBLICATION_MODE: ${EXTRACTION_PUBLICATION_MODE:-manual}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST:-rabbitmq}:5672/

  nginx:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    environment:
      API_PUBLIC_HOST: ${API_PUBLIC_HOST:?Set the certificate DNS name or public IP}
      NGINX_ENVSUBST_FILTER: ^API_PUBLIC_HOST$
    restart: unless-stopped
    logging: *logging
    depends_on: [api]
    ports: ["0.0.0.0:80:80", "0.0.0.0:443:443"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/acme.conf:/etc/nginx/conf.d/acme.conf:ro
      - ./acme-webroot:/var/www/certbot:ro
      - ${API_TLS_CERT_DIR:?API_TLS_CERT_DIR is required}:/etc/nginx/tls:ro

volumes:
  rabbitmq-data:
