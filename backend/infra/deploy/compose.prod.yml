# 운영 서버(prod EC2) 구성. 서버의 /opt/mujuthaek에서 deploy.sh가 이렇게 불러요:
#   docker compose -f compose.prod.yml --env-file .env --env-file versions.env ...
# .env는 GitHub Environment production의 ENV_FILE, versions.env는 서비스별 이미지 태그(API_TAG …)예요.
# DB는 RDS, 원본 파일은 S3(S3_ENDPOINT 빈 값, 인증은 EC2 IAM 역할)라 이 파일에는 없어요.
name: mujuthaek

# 로그는 서버 디스크에만 있어요(밖으로 보내지 않음). 컨테이너마다 50MB × 6개(300MB)까지 돌려써요: 장애 원인을 며칠 거슬러 볼 수 있게.
# 큰 오류는 슬랙으로도 알려요(SLACK_WEBHOOK_URL, README 「운영 알림·로그」)
x-logging: &logging
  driver: json-file
  options: { max-size: "50m", max-file: "6" }

x-app: &app
  # --env-file is for interpolation; each service below receives only its explicit allowlist.
  restart: unless-stopped
  logging: *logging
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  pids_limit: 512
  depends_on:
    rabbitmq: { condition: service_healthy }

services:
  rabbitmq:
    image: rabbitmq:4.1-management@sha256:479361ae8fbb8c852bf67f4acbbfa6f3f6810f8f08119ae6ad4d922bfeaa27c3
    # 노드 이름(rabbit@<호스트 이름>)이 데이터 폴더 이름이에요. 고정하지 않으면 컨테이너가 다시 만들어질 때(설정이 바뀐 배포)
    # 호스트 이름이 바뀌어 빈 폴더로 시작해 큐 안의 메시지·shovel 설정이 사라져요 (실측 2026-10-29 운영: 도로명주소 적재 요청 12건)
    hostname: rabbitmq
    mem_limit: 300m
    restart: unless-stopped
    logging: *logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:15672:15672" # 관리 화면은 서버 안에서만 (ssh -L 15672:127.0.0.1:15672)
      - "10.20.5.63:5672:5672" # 사설 IP에만: dev 서버의 shovel이 dev.mirror를 읽어 가요 (보안 그룹도 dev만 허용)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # DB 테이블 (Flyway). deploy.sh가 그 버전 이미지에서 꺼낸 migrations/<서비스>를 적용해요
  migrate-collector:
    image: flyway/flyway:11.14@sha256:510ae446ffc9129c061860e73633dbc1898d638dc8c965e3b57bba3e916bc32d
    profiles: [migrate]
    logging: *logging
    # 암호는 명령행 인자(프로세스 목록·docker inspect의 Args에 보임)가 아니라 환경 변수로 넘겨요
    environment:
      FLYWAY_PASSWORD: ${COLLECTOR_DB_PASSWORD}
    command: >
      -url=jdbc:postgresql://${RDS_HOST}:5432/collector -user=${COLLECTOR_DB_USER:-collector_app}
      -locations=filesystem:/flyway/sql -connectRetries=10 migrate
    volumes:
      - ./migrations/collector:/flyway/sql:ro

  migrate-extraction:
    image: flyway/flyway:11.14@sha256:510ae446ffc9129c061860e73633dbc1898d638dc8c965e3b57bba3e916bc32d
    profiles: [migrate]
    logging: *logging
    # 암호는 명령행 인자(프로세스 목록·docker inspect의 Args에 보임)가 아니라 환경 변수로 넘겨요
    environment:
      FLYWAY_PASSWORD: ${EXTRACTION_DB_PASSWORD}
    command: >
      -url=jdbc:postgresql://${RDS_HOST}:5432/extraction -user=${EXTRACTION_DB_USER:-extraction_app}
      -locations=filesystem:/flyway/sql -connectRetries=10 migrate
    volumes:
      - ./migrations/extraction:/flyway/sql:ro

  api:
    <<: *app
    image: ${IMAGE_PREFIX:-ghcr.io/prgrms-be-devcourse/nbe11-13-final-team02}/api:${API_TAG:?versions.env에 API_TAG가 없어요}
    mem_limit: 1200m
    environment:
      API_QUERY_TIMEOUT:
      ADMIN_BOOTSTRAP_USER_ID:
      API_DB_PASSWORD:
      API_DB_URL:
      API_DB_USER:
      AWS_ACCESS_KEY_ID:
      AWS_EC2_METADATA_DISABLED:
      AWS_REGION:
      AWS_SECRET_ACCESS_KEY:
      AWS_SESSION_TOKEN:
      COLLECTOR_ADMIN_TOKEN:
      CORS_ORIGINS:
      EMAIL_UNSUBSCRIBE_KEY:
      EXTRACTION_REVIEW_TOKEN:
      EXTRACTION_SLACK_WEBHOOK_URL:
      FRONTEND_URL:
      GA_CREDENTIALS_FILE:
      GA_PROPERTY_ID:
      GOOGLE_CLIENT_ID:
      GOOGLE_CLIENT_SECRET:
      JAVA_TOOL_OPTIONS:
      JUDGING_BENEFIT_CACHE_SIZE:
      JUDGING_CACHE_SIZE:
      JUDGING_PREWARM:
      JUSO_COORD_API_KEY:
      JUSO_SEARCH_API_KEY:
      JWT_SECRET:
      KAKAO_CLIENT_ID:
      KAKAO_CLIENT_SECRET:
      METRICS_TOKEN:
      MINIO_ROOT_PASSWORD:
      MINIO_ROOT_USER:
      NAVER_CLIENT_ID:
      NAVER_CLIENT_SECRET:
      NOTIFICATION_INTERNAL_TOKEN:
      OAUTH_REDIRECT_BASE_URL:
      OPS_ALERT_IGNORE_CODES:
      PUSH_VAPID_PUBLIC_KEY:
      RABBITMQ_HOST:
      RABBITMQ_PASSWORD:
      RABBITMQ_USER:
      S3_BUCKET:
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      SLACK_WEBHOOK_URL:
      SPRING_PROFILES_ACTIVE: prod
      TRAFFIC_INGEST_TOKEN:
      TRAFFIC_IP_SALT:
      MUJUTHAEK_ENV: prod # 슬랙 알림 머리 [prod api]
      NOTIFICATION_SERVER_URL: http://notification:8081
      # 같은 compose 안의 서비스 주소. 없으면 api 컨테이너 안의 localhost로 불러 연결이 거부돼요(관리자 검수·수집 현황 503)
      EXTRACTION_REVIEW_URL: http://extraction:8092
      COLLECTOR_ADMIN_URL: http://collector:8093
      API_DOCS_ENABLED: "false" # API 문서(스웨거)는 운영에서 꺼요. prod 프로필 기본값과 같지만, 프로필 설정이 빠져도 꺼지게
    ports: ["127.0.0.1:8080:8080"]

  notification:
    <<: *app
    image: ${IMAGE_PREFIX:-ghcr.io/prgrms-be-devcourse/nbe11-13-final-team02}/notification:${NOTIFICATION_TAG:?versions.env에 NOTIFICATION_TAG가 없어요}
    environment:
      AWS_ACCESS_KEY_ID:
      AWS_EC2_METADATA_DISABLED:
      AWS_REGION:
      AWS_SECRET_ACCESS_KEY:
      AWS_SESSION_TOKEN:
      JAVA_TOOL_OPTIONS:
      METRICS_TOKEN:
      MUJUTHAEK_ENV:
      NOTIFICATION_DB_PASSWORD:
      NOTIFICATION_DB_URL:
      NOTIFICATION_DB_USER:
      NOTIFICATION_INTERNAL_TOKEN:
      NOTIFICATION_MAIL_CONSENT_API_URL:
      NOTIFICATION_MAIL_FEEDBACK_ADDRESS:
      NOTIFICATION_MAIL_FROM:
      NOTIFICATION_MAIL_PROVIDER:
      NOTIFICATION_PUSH_PROVIDER:
      NOTIFICATION_SES_CONFIGURATION_SET:
      NOTIFICATION_SES_MAX_PER_SECOND:
      NOTIFICATION_WEB_BASE_URL:
      PUSH_VAPID_PRIVATE_KEY:
      PUSH_VAPID_PUBLIC_KEY:
      PUSH_VAPID_SUBJECT:
      RABBITMQ_HOST:
      RABBITMQ_PASSWORD:
      RABBITMQ_USER:
      SLACK_WEBHOOK_URL:
      SPRING_PROFILES_ACTIVE: prod
    mem_limit: 500m
    ports: ["127.0.0.1:8081:8081"]

  # 파이썬 워커는 DB_URL·RABBITMQ_URL 한 줄 주소를 읽어요. .env의 이름을 여기서 바꿔 넘겨요
  collector:
    <<: *app
    image: ${IMAGE_PREFIX:-ghcr.io/prgrms-be-devcourse/nbe11-13-final-team02}/collector:${COLLECTOR_TAG:?versions.env에 COLLECTOR_TAG가 없어요}
    mem_limit: 400m
    environment:
      AWS_ACCESS_KEY_ID:
      AWS_EC2_METADATA_DISABLED:
      AWS_REGION:
      AWS_SECRET_ACCESS_KEY:
      AWS_SESSION_TOKEN:
      BIZINFO_API_KEY:
      COLLECTOR_ACTIVE_ONLY:
      COLLECTOR_ADMIN_HOST:
      COLLECTOR_ADMIN_PORT:
      COLLECTOR_ADMIN_TOKEN:
      COLLECTOR_DELAY_SECONDS:
      COLLECTOR_DETAIL_LIMIT:
      COLLECTOR_INTAKE_HOUSING_LH:
      COLLECTOR_INTAKE_HOUSING_OTHER:
      COLLECTOR_INTAKE_POLICY:
      COLLECTOR_INTAKE_SPACE:
      COLLECTOR_MAX_PAGES:
      COLLECTOR_PARALLEL_SOURCES:
      COLLECTOR_POLICY_HOURLY:
      COLLECTOR_SINCE_DAYS:
      COLLECTOR_USER_AGENT:
      DATA_GO_KR_SERVICE_KEY:
      POLICY_API_DELAY_SECONDS:
      POLICY_DETAIL_LIMIT:
      POLICY_MAX_FILES:
      POLICY_YOUTH_CATEGORIES:
      S3_BUCKET:
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      SLACK_WEBHOOK_URL:
      YOUTHCENTER_API_KEY:
      SERVICE_NAME: collector
      MUJUTHAEK_ENV: prod
      DB_URL: ${COLLECTOR_DB_URL}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST:-rabbitmq}:5672/

  extraction:
    <<: *app
    image: ${IMAGE_PREFIX:-ghcr.io/prgrms-be-devcourse/nbe11-13-final-team02}/extraction:${EXTRACTION_TAG:?versions.env에 EXTRACTION_TAG가 없어요}
    mem_limit: 500m
    environment:
      AWS_ACCESS_KEY_ID:
      AWS_EC2_METADATA_DISABLED:
      AWS_REGION:
      AWS_SECRET_ACCESS_KEY:
      AWS_SESSION_TOKEN:
      CONTRACTS_DIR:
      EXTRACTION_BENEFIT_ENABLED:
      EXTRACTION_CALL_CACHE:
      EXTRACTION_CALL_CACHE_DAYS:
      EXTRACTION_DAILY_BUDGET_USD:
      EXTRACTION_ENV:
      EXTRACTION_IMAGE_OCR:
      EXTRACTION_LOCAL_FILES_DIR:
      EXTRACTION_MAX_ATTEMPTS:
      EXTRACTION_METHOD:
      EXTRACTION_MODEL_MODE:
      EXTRACTION_MONTHLY_BUDGET_USD:
      EXTRACTION_NOTICE_BUDGET_USD:
      EXTRACTION_PARALLEL_CALLS:
      EXTRACTION_PARALLEL_STAGGER_SECONDS:
      EXTRACTION_PRESPLIT_DOC_ROWS:
      EXTRACTION_RECORDED_DIR:
      EXTRACTION_RELAY_SECONDS:
      EXTRACTION_REPAIR_MIN_BAD_ITEMS:
      EXTRACTION_REQUIRE_PDF:
      EXTRACTION_RETRY_SECONDS:
      EXTRACTION_REVIEW_DB_POOL:
      EXTRACTION_REVIEW_HOST:
      EXTRACTION_REVIEW_PORT:
      EXTRACTION_REVIEW_TOKEN:
      EXTRACTION_SERIAL_EVENTS:
      EXTRACTION_STANDIN_DIR:
      EXTRACTION_STANDIN_REPLAY_DIR:
      LANGSMITH_API_KEY:
      LANGSMITH_ENDPOINT:
      LANGSMITH_PROJECT:
      LANGSMITH_TRACING:
      LOCAL_AI_MODEL:
      LOCAL_AI_URL:
      OPENAI_API_KEY:
      OPENAI_LIGHT_CALLS:
      OPENAI_LIGHT_EFFORT:
      OPENAI_MODEL:
      OPENAI_REASONING_EFFORT:
      OPENAI_SHARED_SCHEMA:
      OPENAI_STREAM:
      S3_BUCKET:
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      SLACK_WEBHOOK_URL:
      SERVICE_NAME: extraction
      MUJUTHAEK_ENV: prod
      DB_URL: ${EXTRACTION_DB_URL}
      # 공개 관문은 실패 시 닫힘(manual: 결과를 DB에 보류)이에요. 코드 기본값과 같지만, 이미지 버전과 무관하게 명시해요.
      # 예전 동작이 필요하면 .env에 EXTRACTION_PUBLICATION_MODE=legacy를 명시하세요(보안 감사 4절)
      EXTRACTION_PUBLICATION_MODE: ${EXTRACTION_PUBLICATION_MODE:-manual}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST:-rabbitmq}:5672/

  # Vercel은 HTTPS로 연결해요. 인증서 디렉터리가 없으면 배포를 중단해요.
  nginx:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    environment:
      API_PUBLIC_HOST: ${API_PUBLIC_HOST:?Set the certificate DNS name or public IP}
      NGINX_ENVSUBST_FILTER: ^API_PUBLIC_HOST$
    restart: unless-stopped
    logging: *logging
    depends_on: [api]
    ports: ["0.0.0.0:80:80", "0.0.0.0:443:443"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/acme.conf:/etc/nginx/conf.d/acme.conf:ro
      - ./acme-webroot:/var/www/certbot:ro
      - ${API_TLS_CERT_DIR:?API_TLS_CERT_DIR is required}:/etc/nginx/tls:ro

  # 성능 테스트 때만 켜요(profile perf, deploy.sh는 띄우지 않아요). 노트북 Prometheus가 SSH 터널로 읽어요 (perf/README.md)
  node-exporter:
    image: prom/node-exporter:v1.9.1@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
    profiles: [perf]
    mem_limit: 64m
    logging: *logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    pids_limit: 64
    command: ["--path.procfs=/host/proc", "--path.sysfs=/host/sys", "--no-collector.filesystem"]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    ports: ["127.0.0.1:9100:9100"]

  # cAdvisor was removed: its host mounts exposed the Docker control socket.
  # Use application Prometheus metrics and node-exporter; add a separately authorized collector if required.

volumes:
  rabbitmq-data:
