limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;
# OAuth 시작마다 10분짜리 세션이 생겨요. 여러 IP로 나눠 보내도 세션이 쌓이지 않게 서버 전체로도 묶어요(보안 감사 L-16).
limit_req_zone $server_name zone=login_total:1m rate=2r/s;
limit_req_zone $binary_remote_addr zone=api_ip:2m rate=20r/s;
limit_req_zone $server_name zone=api_total:1m rate=60r/s;
limit_req_zone $server_name zone=downloads:1m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=connections_ip:2m;
limit_conn_zone $server_name zone=connections_total:1m;
limit_conn_zone $server_name zone=streams:1m;
limit_conn_zone $server_name zone=files:1m;
# 쿼리에는 OAuth code·인증 토큰이 들어갈 수 있어 $request·$request_uri를 기록하지 않아요.
log_format security escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method","path":"$uri","status":"$status","duration":"$request_time","rate":"$limit_req_status","connections":"$limit_conn_status"}';
# 등록한 이름(API 도메인·고정 IP)이 아닌 Host는 응답 없이 연결을 끊어요(444). 인증서는 있어야 IP로 오는 TLS 연결을 받을 수 있어요.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    access_log /var/log/nginx/access.log security;
    error_log /var/log/nginx/error.log crit;
    return 444;
}
server {
    listen 443 ssl;
    # 첫 이름이 $server_name이에요. 앱에 넘기는 X-Forwarded-Host는 클라이언트 Host가 아니라 이 값으로 고정해요.
    server_name api.mujuthaek.store 3.34.67.209;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # 세션 티켓 키는 재시작 전까지 바뀌지 않아 전방 비밀성을 깨요.
    ssl_session_tickets off;
    # 포트 80은 인증서 발급 파일만 줘요. preload는 되돌리기 어려워 넣지 않아요.
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;
    # nginx는 원본 URI를 그대로 넘겨요. 경로의 `;`(경로 매개변수)·`..` 조각은 정상 API에 없고, 앱이 nginx와 다르게 해석하면
    # /api/..;/internal 같은 우회가 생겨요. 쿼리(`?` 뒤)의 `;`는 검색어일 수 있어 막지 않아요(보안 감사 4절).
    if ($request_uri ~* "^[^?]*(;|%3b|%2e%2e|%2e\.|\.%2e|/\.\.(/|\?|$))") { return 400; }
    access_log /var/log/nginx/access.log security;
    # 일반 error 로그는 요청 쿼리를 포함해요. HTTP 장애·제한은 위의 비식별 쿼리 없는 기록으로 확인해요.
    error_log /var/log/nginx/error.log crit;
    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;
    keepalive_requests 100;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn connections_ip 64;
    limit_conn connections_total 96;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Ssl "";
    # health는 요청마다 DB·MQ를 확인해요. 일반 API와 같은 IP별·전체 예산을 써요(보안 감사 L-16).
    location = /actuator/health {
        limit_req zone=api_ip burst=60 nodelay;
        limit_req zone=api_total burst=120 nodelay;
        proxy_pass http://api:8080;
    }
    location /actuator { return 404; }
    location /internal { return 404; }
    location /api/ {
        limit_req zone=api_ip burst=60 nodelay;
        limit_req zone=api_total burst=120 nodelay;
        proxy_pass http://api:8080;
    }
    # 긴 읽기 대기는 실제 SSE에만 허용해요. 새 limit_conn이 있으면 상위 제한을 모두 다시 적어야 해요.
    location ~ "^/api/v1/notices/[0-9a-fA-F-]{36}/chat/stream$" {
        limit_req zone=api_ip burst=60 nodelay;
        limit_req zone=api_total burst=120 nodelay;
        limit_conn connections_ip 64;
        limit_conn connections_total 96;
        limit_conn streams 48;
        proxy_pass http://api:8080;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location ~ ^/api/(v1/notices|admin/reviews)/[^/]+/files/[^/]+$ {
        limit_req zone=api_ip burst=60 nodelay;
        limit_req zone=api_total burst=120 nodelay;
        limit_req zone=downloads burst=6 nodelay;
        limit_conn connections_ip 64;
        limit_conn connections_total 96;
        limit_conn files 8;
        proxy_pass http://api:8080;
    }
    location /oauth2/ {
        limit_req zone=login burst=5 nodelay;
        limit_req zone=login_total burst=20 nodelay;
        proxy_pass http://api:8080;
    }
    # 콜백은 실패해도 세션을 만들지 않아요(LoginFailureHandler). 일반 API의 IP별·전체 제한으로 충분하고, 여기에 login_total을
    # 걸면 값싼 콜백 요청만으로 모든 로그인 시작을 막을 수 있어요.
    location /login/oauth2/ {
        limit_req zone=api_ip burst=60 nodelay;
        limit_req zone=api_total burst=120 nodelay;
        proxy_pass http://api:8080;
    }
    # 사용자 화면은 Vercel에서만 제공해 오래된 서버 내 프론트가 노출되지 않게 해요.
    location / { return 302 https://mujuthaek.vercel.app$request_uri; }
}
