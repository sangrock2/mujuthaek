limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 10m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Ssl "";
    location = /actuator/health { proxy_pass http://api:8080; }
    location /actuator { return 404; }
    location /internal { return 404; }
    location /api/ {
        proxy_pass http://api:8080;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location /oauth2/ {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8080;
    }
    location /login/oauth2/ { proxy_pass http://api:8080; }
    # 사용자 화면은 Vercel에서만 제공해 오래된 서버 내 프론트가 노출되지 않게 해요.
    location / { return 302 https://mujuthaek.vercel.app$request_uri; }
}
