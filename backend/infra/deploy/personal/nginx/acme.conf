# Port 80 serves ACME validation files only. Application/API requests never reach upstream here.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    # This listener has no application traffic. Do not log accidentally supplied token queries.
    access_log off;
    error_log /var/log/nginx/error.log crit;
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 5s;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
        limit_except GET HEAD { deny all; }
    }
    location / { return 404; }
}
