# api 앞 프록시 (compose의 nginx). Vercel rewrites가 /api/**·/oauth2/**·/login/oauth2/**를 http://<탄력적 IP>:80으로 넘겨요.
# 모든 경로를 api로 넘기고, actuator는 /actuator/health만 열어요.
# Vercel이 보낸 X-Forwarded-Host·Proto·For는 덮어쓰지 않고 그대로, 없을 때만 Host·For는 이 연결 값($host·$remote_addr), Proto는 https로 넘겨요.
# api는 server.forward-headers-strategy=framework라 이 값으로 https://<Vercel 주소> 기준 OAuth redirect-uri·주소를 만들어요.
# 이 서버로 들어오는 길은 Vercel(https)뿐이라, X-Forwarded-Proto가 없으면 https로 넘겨요
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      https;
}

map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ""      $host;
}

map $http_x_forwarded_for $forwarded_for {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

# 로그인 시작(/oauth2/authorization/…)은 요청마다 로그인 중간 세션을 만들어요(10분 유지). 대량으로 부르면 세션이 쌓이므로 요청 수를 제한해요
# (2026-11-10 재검토: 앱에서는 막을 수 없었음). 들어오는 길이 Vercel뿐이라 연결 주소($remote_addr)는 모든 사용자가 같아요.
# 사용자별 제한은 Vercel이 덮어쓴 X-Forwarded-For의 첫 주소로, 전체 제한은 연결 주소로 해요(nginx를 바로 부르며 X-Forwarded-For를 꾸며
# 사용자별 제한을 피해도 전체 제한에 걸려요). 넘으면 429
map $http_x_forwarded_for $login_client {
    ~^(?<first>[^,]+) $first;
    default           $remote_addr;
}
limit_req_zone $login_client zone=login_client:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=login_all:1m rate=300r/m;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $forwarded_host;
    # 위 셋 말고 api가 읽는 전달 헤더는 지워요(빈 값이면 넘기지 않음). Forwarded는 X-Forwarded-*보다 먼저 쓰이고,
    # X-Forwarded-Prefix는 요청 주소 앞을 바꿔요. 클라이언트가 붙여 보내면 주소·IP를 꾸밀 수 있었어요(2026-11-10 코드 검토)
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Ssl "";
    # 채팅 SSE가 바로 흘러가게 버퍼를 끄고, 오래 열린 연결을 끊지 않아요
    proxy_buffering off;
    proxy_read_timeout 1h;

    location = /actuator/health {
        proxy_pass http://api:8080;
    }

    location /actuator/ {
        return 404;
    }

    location /oauth2/authorization/ {
        limit_req zone=login_client burst=10 nodelay;
        limit_req zone=login_all burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8080;
    }

    location / {
        proxy_pass http://api:8080;
    }
}
